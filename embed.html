<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwitchStats Pro Widget Embed</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-dark: #070709;
            --bg-card: rgba(18, 18, 26, 0.85);
            --primary: #9146ff;
            --primary-glow: rgba(145, 70, 255, 0.4);
            --accent-pink: #ff0055;
            --accent-cyan: #00f0ff;
            --text-main: #f4f4f8;
            --text-muted: #9a9ab0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .widget-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            height: 100%;
            position: relative;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.85rem;
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .name {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .handle {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.25rem 0.65rem;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .badge.live {
            background: var(--accent-pink);
            color: white;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
            animation: pulse 1.5s infinite;
        }

        .badge.offline {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.65rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-label {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-val {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .chart-section {
            position: relative;
            flex: 1;
            min-height: 110px;
            width: 100%;
        }

        .widget-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--glass-border);
            padding-top: 0.6rem;
            font-size: 0.75rem;
        }

        .brand-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 800;
            font-family: var(--font-heading);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .brand-link:hover {
            text-decoration: underline;
        }

        .twitch-btn {
            background: linear-gradient(135deg, var(--primary), #6815e8);
            color: white;
            text-decoration: none;
            padding: 0.3rem 0.75rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.75rem;
            transition: transform 0.2s ease;
        }

        .twitch-btn:hover {
            transform: scale(1.04);
        }
    </style>
</head>

<body>
    <div class="widget-card">
        <div class="widget-header">
            <div class="profile-main">
                <img id="avatar" class="avatar" src="https://ui-avatars.com/api/?name=Twitch&background=9146FF&color=fff" alt="Avatar">
                <div class="profile-info">
                    <span id="name" class="name">Betöltés...</span>
                    <span id="handle" class="handle">@streamer</span>
                </div>
            </div>
            <span id="badge" class="badge offline">OFFLINE</span>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Követők</span>
                <span id="followers" class="stat-val">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Élő Nézők</span>
                <span id="viewers" class="stat-val">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Megtekintés</span>
                <span id="views" class="stat-val">0</span>
            </div>
        </div>

        <div class="chart-section">
            <canvas id="miniChart"></canvas>
        </div>

        <div class="widget-footer">
            <a id="brandLink" href="/" target="_blank" class="brand-link">🟣 TwitchStats PRO</a>
            <a id="twitchLink" href="https://twitch.tv" target="_blank" class="twitch-btn">Megnyitás Twitch-en</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Chart.defaults.color = '#9a9ab0';
            Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

            const urlParams = new URLSearchParams(window.location.search);
            const streamer = urlParams.get('q') || 'TheVR';

            const nameEl = document.getElementById('name');
            const handleEl = document.getElementById('handle');
            const avatarEl = document.getElementById('avatar');
            const badgeEl = document.getElementById('badge');
            const followersEl = document.getElementById('followers');
            const viewersEl = document.getElementById('viewers');
            const viewsEl = document.getElementById('views');
            const brandLink = document.getElementById('brandLink');
            const twitchLink = document.getElementById('twitchLink');

            brandLink.href = `${window.location.origin}?q=${encodeURIComponent(streamer)}`;

            try {
                const res = await fetch(`/api/streamer?q=${encodeURIComponent(streamer)}`);
                const data = await res.json();

                nameEl.innerText = data.name;
                handleEl.innerText = `@${data.login}`;
                avatarEl.src = data.avatar;
                twitchLink.href = `https://twitch.tv/${data.login}`;

                followersEl.innerText = data.followers > 0 ? new Intl.NumberFormat('hu-HU', { notation: 'compact' }).format(data.followers) : '-';
                viewsEl.innerText = data.view_count > 0 ? new Intl.NumberFormat('hu-HU', { notation: 'compact' }).format(data.view_count) : '-';
                viewersEl.innerText = data.is_live ? new Intl.NumberFormat('hu-HU', { notation: 'compact' }).format(data.viewers) : '0';

                if (data.is_live) {
                    badgeEl.innerText = 'ÉLŐ';
                    badgeEl.className = 'badge live';
                } else {
                    badgeEl.innerText = 'OFFLINE';
                    badgeEl.className = 'badge offline';
                }

                // Render Mini Sparkline Chart
                renderMiniChart(data.viewers > 0 ? data.viewers : 3500);

            } catch (err) {
                nameEl.innerText = 'Hiba';
            }
        });

        function renderMiniChart(baseVal) {
            const ctx = document.getElementById('miniChart').getContext('2d');
            const points = Array.from({ length: 12 }, () => Math.round(baseVal * (0.8 + Math.random() * 0.4)));

            const gradient = ctx.createLinearGradient(0, 0, 0, 110);
            gradient.addColorStop(0, 'rgba(145, 70, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(145, 70, 255, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({ length: 12 }, (_, i) => i + 1),
                    datasets: [{
                        data: points,
                        borderColor: '#9146ff',
                        backgroundColor: gradient,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }
    </script>
</body>

</html>
